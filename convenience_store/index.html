<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>손님들의 무한 편의점 🏪 | 쿠루미의 미션 대모험</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ─────────── 시작 화면 ─────────── -->
  <section id="screenStart" class="screen active">
    <div class="start-bg-deco">🍬 🧃 🍭 🍩 🧋 🍫</div>
    <div class="start-card">
      <h1 class="game-title">손님들의<br>무한 편의점 🏪</h1>
      <img class="kurumi-hero" src="assets/img/kurumi_idle.png" alt="쿠루미">
      <p class="game-sub">쿠루미와 함께 미션을 완료하고<br>코인을 모아 원하는 걸 사보세요!</p>
      <div class="mission-preview">
        <div class="mp-item"><img src="assets/img/item_water.png" alt="물"><span>물 마시기</span></div>
        <div class="mp-item"><img src="assets/img/item_ramen.png" alt="라면"><span>라면 먹기</span></div>
        <div class="mp-item"><img src="assets/img/item_cola.png" alt="콜라"><span>콜라 마시기</span></div>
      </div>
      <button id="btnStart" class="btn-main">🎮 시작하기</button>
      <a href="../index.html" class="btn-home">🏠 게임 목록으로</a>
    </div>
  </section>

  <!-- ─────────── 게임 플레이 화면 ─────────── -->
  <section id="screenGame" class="screen">
    <div class="store-bg" style="background-image:url('assets/img/store_bg.png');"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-left">
        <div class="timer-wrap">
          <div class="timer-bar-bg"><div id="timerBar" class="timer-bar-fill"></div></div>
          <span id="timerText">20</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="coin-wrap">
          <img src="assets/img/coin.png" alt="코인" class="coin-icon">
          <span id="coinText">0</span>
        </div>
        <button id="btnMute" class="hud-btn" title="음소거">🔊</button>
        <button id="btnShop" class="hud-btn hud-shop" title="상점">🛍️</button>
      </div>
    </div>

    <!-- 미션 콤보 안내 -->
    <div id="comboToast" class="combo-toast"></div>

    <!-- 쿠루미 캐릭터 -->
    <div id="kurumiWrap" class="kurumi-wrap">
      <img id="kurumiImg" src="assets/img/kurumi_idle.png" alt="쿠루미" class="kurumi-char">
      <div id="itemPile" class="item-pile"></div>
    </div>

    <!-- 미션 카드 -->
    <div id="missionCard" class="mission-card">
      <div class="mission-head">
        <img id="missionIcon" class="mission-icon" src="" alt="미션 아이콘">
        <div class="mission-info">
          <div id="missionName" class="mission-name">미션 준비중...</div>
          <div class="mission-gauge-bg"><div id="missionGauge" class="mission-gauge-fill"></div></div>
        </div>
      </div>
      <button id="btnTap" class="btn-tap">
        <span id="btnTapLabel">탭! 탭! 탭!</span>
      </button>
      <div class="mission-hint">화면을 빠르게 톡톡톡 눌러주세요! 👆</div>
    </div>
  </section>

  <!-- ─────────── 상점 오버레이 ─────────── -->
  <section id="screenShop" class="screen overlay">
    <div class="shop-panel">
      <div class="shop-header">
        <h2>🛍️ 쿠루미의 상점</h2>
        <div class="shop-coin"><img src="assets/img/coin.png" alt="코인"><span id="shopCoinText">0</span></div>
        <button id="btnCloseShop" class="btn-close">✕</button>
      </div>
      <div class="shop-grid" id="shopGrid"><!-- JS로 12개 아이템 렌더링 --></div>
      <div id="shopMsg" class="shop-msg"></div>
      <button id="btnResumeFromShop" class="btn-main btn-shop-resume">▶ 게임 계속하기</button>
    </div>
  </section>

  <!-- ─────────── 게임 오버 화면 ─────────── -->
  <section id="screenOver" class="screen">
    <div class="over-card">
      <img id="overKurumi" class="kurumi-hero kurumi-sad" src="assets/img/kurumi_sad.png" alt="쿠루미">
      <h2 id="overTitle" class="over-title">시간이 다 됐어요!</h2>
      <p id="overSub" class="over-sub">쿠루미가 미션을 다 못 끝냈어요 😢</p>
      <div class="over-stats">
        <div class="stat-box">
          <img src="assets/img/coin.png" class="mini-coin">
          <span id="finalCoins">0</span>
          <small>모은 코인</small>
        </div>
        <div class="stat-box">
          <span id="finalMissions">0</span>
          <small>완료 미션</small>
        </div>
      </div>
      <button id="btnRetry" class="btn-main">🔄 다시하기</button>
      <a href="../index.html" class="btn-home">🏠 게임 목록으로</a>
    </div>
  </section>

</div>

<!-- 오디오 -->
<audio id="sndBgm" src="assets/sound/bgm.mp3" loop preload="auto"></audio>
<audio id="sndTap" src="assets/sound/tap.mp3" preload="auto"></audio>
<audio id="sndSuccess" src="assets/sound/success.mp3" preload="auto"></audio>
<audio id="sndCoin" src="assets/sound/coin_sound.mp3" preload="auto"></audio>
<audio id="sndGameOver" src="assets/sound/game_over_sound.mp3" preload="auto"></audio>
<audio id="sndButton" src="assets/sound/button_click_sound.mp3" preload="auto"></audio>
<audio id="sndPurchase" src="assets/sound/purchase_sound.mp3" preload="auto"></audio>
<audio id="sndTimerWarning" src="assets/sound/timer_warning.mp3" preload="auto"></audio>

<script src="js/game.js"></script>
</body>
</html>
